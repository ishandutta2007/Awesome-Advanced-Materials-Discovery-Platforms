<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <style>
      .lattice-line {
        stroke-dasharray: 8, 8;
        animation: flowDash 20s linear infinite;
      }
      .lattice-line-rev {
        stroke-dasharray: 6, 6;
        animation: flowDashRev 15s linear infinite;
      }
      .floating-node-1 {
        animation: floatA 7s ease-in-out infinite alternate;
      }
      .floating-node-2 {
        animation: floatB 9s ease-in-out infinite alternate;
      }
      .floating-node-3 {
        animation: floatC 8s ease-in-out infinite alternate;
      }
      .pulse-orb {
        animation: pulseOrb 6s ease-in-out infinite alternate;
      }
      .shimmer-pill {
        animation: shimmer 4s ease-in-out infinite alternate;
      }

      @keyframes flowDash {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 200; }
      }
      @keyframes flowDashRev {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatA {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-16px) rotate(8deg); }
      }
      @keyframes floatB {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(18px) rotate(-10deg); }
      }
      @keyframes floatC {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes pulseOrb {
        0% { opacity: 0.5; transform: scale(0.95); }
        100% { opacity: 0.85; transform: scale(1.08); }
      }
      @keyframes shimmer {
        0% { stroke-opacity: 0.3; }
        100% { stroke-opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Technical Lattice Grid -->
  <rect width="1200" height="420" fill="url(#gridPattern)" />

  <!-- Animated Ambient Glow Orbs -->
  <g class="pulse-orb" style="transform-origin: 200px 140px;">
    <circle cx="200" cy="140" r="220" fill="url(#orbCyan)" />
  </g>
  <g class="pulse-orb" style="transform-origin: 1000px 220px; animation-delay: -3s;">
    <circle cx="1000" cy="220" r="260" fill="url(#orbViolet)" />
  </g>
  <g class="pulse-orb" style="transform-origin: 600px 380px; animation-delay: -1.5s;">
    <circle cx="600" cy="380" r="180" fill="url(#orbEmerald)" />
  </g>

  <!-- Dynamic Crystal Lattice Vectors (Background Layer) -->
  <!-- Left Crystal Cluster -->
  <g class="floating-node-1" style="transform-origin: 140px 190px;">
    <!-- Molecular Bonds -->
    <line x1="80" y1="90" x2="160" y2="130" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" class="lattice-line" />
    <line x1="160" y1="130" x2="210" y2="230" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5" class="lattice-line" />
    <line x1="160" y1="130" x2="90" y2="260" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" class="lattice-line-rev" />
    <line x1="90" y1="260" x2="180" y2="330" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.4" class="lattice-line" />
    <line x1="80" y1="90" x2="40" y2="180" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.3" />
    <line x1="40" y1="180" x2="90" y2="260" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.3" />

    <!-- Crystal Nodes (Atoms) -->
    <circle cx="80" cy="90" r="7" fill="#38bdf8" />
    <circle cx="80" cy="90" r="14" fill="#38bdf8" fill-opacity="0.2" />
    <circle cx="160" cy="130" r="9" fill="#818cf8" />
    <circle cx="160" cy="130" r="18" fill="#818cf8" fill-opacity="0.25" />
    <circle cx="210" cy="230" r="6" fill="#c084fc" />
    <circle cx="90" cy="260" r="8" fill="#00f2fe" />
    <circle cx="90" cy="260" r="16" fill="#00f2fe" fill-opacity="0.2" />
    <circle cx="40" cy="180" r="5" fill="#a855f7" />
    <circle cx="180" cy="330" r="7" fill="#38bdf8" />
  </g>

  <!-- Right Crystal Cluster -->
  <g class="floating-node-2" style="transform-origin: 1040px 180px;">
    <!-- Molecular Bonds -->
    <line x1="1020" y1="90" x2="1110" y2="140" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5" class="lattice-line" />
    <line x1="1110" y1="140" x2="1080" y2="240" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5" class="lattice-line-rev" />
    <line x1="1080" y1="240" x2="990" y2="290" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" class="lattice-line" />
    <line x1="990" y1="290" x2="1060" y2="350" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" class="lattice-line-rev" />
    <line x1="1020" y1="90" x2="960" y2="160" stroke="#00f2fe" stroke-width="1.2" stroke-opacity="0.3" />
    <line x1="960" y1="160" x2="990" y2="290" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.3" />

    <!-- Crystal Nodes (Atoms) -->
    <circle cx="1020" cy="90" r="8" fill="#818cf8" />
    <circle cx="1020" cy="90" r="16" fill="#818cf8" fill-opacity="0.2" />
    <circle cx="1110" cy="140" r="9" fill="#c084fc" />
    <circle cx="1110" cy="140" r="18" fill="#c084fc" fill-opacity="0.25" />
    <circle cx="1080" cy="240" r="7" fill="#38bdf8" />
    <circle cx="990" cy="290" r="8" fill="#00f2fe" />
    <circle cx="990" cy="290" r="16" fill="#00f2fe" fill-opacity="0.2" />
    <circle cx="960" cy="160" r="5" fill="#a855f7" />
    <circle cx="1060" cy="350" r="6" fill="#818cf8" />
  </g>

  <!-- Center Foreground Content Container (Guaranteed foreground clarity) -->
  <g id="foreground-content">
    <!-- Top Taxonomy Pill -->
    <g transform="translate(600, 68)" text-anchor="middle">
      <rect x="-215" y="-18" width="430" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="url(#borderGrad)" stroke-width="1.2" class="shimmer-pill" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" letter-spacing="2">
        ⚛️ AI-DRIVEN MATERIALS SCIENCE &amp; INFORMATICS
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5" filter="drop-shadow(0 4px 18px rgba(0,0,0,0.85))">
      Advanced Materials Discovery Platforms
    </text>

    <!-- Subtitle -->
    <text x="600" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.2" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.9))">
      Curated Landscape of SaaS Solutions &amp; Open-Source Projects for Accelerated Materials Innovation
    </text>

    <!-- Value Proposition Line -->
    <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      Machine Learning Force Fields • Generative Crystal Design • Autonomous Labs • High-Throughput DFT
    </text>

    <!-- Dynamic Category Badges / Pills (Foreground Footer) -->
    <g transform="translate(600, 310)" text-anchor="middle">
      <!-- Pill 1: Enterprise SaaS -->
      <g transform="translate(-360, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
        <circle cx="-62" cy="0" r="4.5" fill="#38bdf8" />
        <text x="7" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">🏢 Enterprise SaaS</text>
      </g>

      <!-- Pill 2: Open-Source Hub -->
      <g transform="translate(-180, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.2" />
        <circle cx="-62" cy="0" r="4.5" fill="#818cf8" />
        <text x="7" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">💻 Open-Source</text>
      </g>

      <!-- Pill 3: Autonomous Labs -->
      <g transform="translate(0, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#c084fc" stroke-width="1.2" />
        <circle cx="-62" cy="0" r="4.5" fill="#c084fc" />
        <text x="7" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">🤖 Autonomous Labs</text>
      </g>

      <!-- Pill 4: Generative Crystals -->
      <g transform="translate(180, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#34d399" stroke-width="1.2" />
        <circle cx="-62" cy="0" r="4.5" fill="#34d399" />
        <text x="7" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">✨ Generative AI</text>
      </g>

      <!-- Pill 5: Open Benchmarks -->
      <g transform="translate(360, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#f472b6" stroke-width="1.2" />
        <circle cx="-62" cy="0" r="4.5" fill="#f472b6" />
        <text x="7" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">📈 Benchmarks</text>
      </g>
    </g>

    <!-- Bottom Accent Glow Bar -->
    <rect x="250" y="380" width="700" height="2" rx="1" fill="url(#textGrad)" opacity="0.75" />
  </g>
</svg>
